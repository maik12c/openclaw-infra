---
# Non-secret defaults for OpenClaw provisioning.
# Secrets are passed via scripts/provision.sh from Pulumi config.

openclaw_timezone: "Europe/Berlin"
# Since 2026-09-09 the ChatGPT-account Codex backend rejects gpt-5.4 / gpt-5.4-mini
# ("not supported when using Codex with a ChatGPT account"). Supported there:
# gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5. Since 2026.9.x the openai
# provider routes these through the ChatGPT OAuth profile (no more openai-codex/ prefix).
openclaw_model_primary: "openai/gpt-5.6-sol"
openclaw_model_fallbacks:
  - "openai/gpt-5.6-luna"
openclaw_heartbeat_model: "openai/gpt-5.6-luna"
openclaw_thinking_default: "off"

# Custom model definitions (for models not yet in OpenClaw's built-in registry)
# Do NOT define models.providers.openai here. An authored openai provider
# (api: openai-completions + apiKey) forces the OpenClaw runtime with Platform
# API-key billing and blocks the Codex/ChatGPT-subscription route; forcing
# agentRuntime codex on top fails closed ("Codex cannot reproduce the prepared
# provider route"). The OpenAI API key lives in the openai:audio auth profile
# instead (config role), used only by audio transcription.
openclaw_custom_models:
  mode: "merge"
  providers: {}
nodejs_major_version: 25
openclaw_version: "2026.10.10"
# Host Claude Code CLI: the claude-cli model runtime and plugin management share
# one pinned install (@anthropic-ai/claude-code). Update intentionally.
claude_code_version: "2.1.97"
# Bump only after reviewing the versioned heartbeat + cron contracts documented
# in docs/DOCS-REVIEW.md. Provisioning refuses scheduler changes on a mismatch.
openclaw_docs_reviewed_version: "2026.10.10"
# Agent existence never opts into autonomous work. Deployments must explicitly
# enable scheduled automation per agent in group_vars/openclaw.yml.
openclaw_scheduled_automation_default: false
# Latent cadence used only after an agent opts into scheduled automation.
openclaw_heartbeat_interval: "30m"
openclaw_agent_timeout_seconds: 1500  # 25 minutes per conversation turn (default: 600)
openclaw_cooldown_failure_window_hours: 1  # reset cooldown error count after 1h (default: 24)
openclaw_elevated_default: "off"

# Voice transcription (OpenAI) via the dedicated openai:audio API-key profile,
# so chat stays on ChatGPT OAuth (see docs/nodes/audio.md in the openclaw package).
openclaw_audio_provider: "openai"
openclaw_audio_model: "gpt-4o-transcribe"

# Voice output (text-to-speech)
# auto: "inbound" = Agent antwortet mit Sprache nur wenn Nutzer Sprachnachricht schickt
# auto: "always"  = Agent antwortet immer mit Sprache
# auto: "off"     = kein TTS
openclaw_tts_provider: "openai"   # nutzt bestehenden openaiApiKey; ~$0.015/1000 Zeichen
openclaw_tts_auto: "inbound"      # Voice reply only when user sends voice message

# Image generation (Google Gemini)
# Set via: pulumi config set geminiApiKey --secret
openclaw_image_generation_model: "google/gemini-3-pro-image-preview"
openclaw_image_generation_fallbacks:
  - "google/gemini-3.1-flash-image-preview"

# Compaction safeguard: flush memories to disk before context compression
# Prevents silent loss of in-context state when long sessions get compacted.
# See: https://docs.openclaw.ai/concepts/compaction, openclaw/openclaw#5429
openclaw_compaction_mode: "safeguard"
openclaw_compaction_reserve_tokens_floor: 50000   # was 24000; 50K gives compaction room within 200K API limit
openclaw_compaction_memory_flush: true
openclaw_compaction_memory_flush_threshold: 20000  # was 8000; flush memories 20K tokens before compaction trigger
openclaw_compaction_memory_flush_prompt: >-
  Distill important context from this session to memory/YYYY-MM-DD.md (today's date).
  Focus on: decisions made, task progress, blockers, lessons learned.
  Skip routine exchanges. If nothing worth storing: NO_FLUSH
openclaw_compaction_memory_flush_system_prompt: >-
  Extract only durable facts worth remembering across sessions. Be selective.
openclaw_compaction_notify_user: true   # show "Compacting context..." notice in chat (2026.4.2+)

# Concurrency settings
openclaw_max_concurrent: 8
openclaw_subagents_max_concurrent: 16

# Node exec settings (for remote Mac node control)
# ⚠️  SECURITY WARNING: Node exec lets agents run arbitrary shell commands on your
# local machine (Mac) via the OpenClaw node host. This is powerful but dangerous:
# - An agent (or attacker via prompt injection) can read/modify local files
# - If your Mac has Pulumi state, cloud credentials, or SSH keys, they're accessible
# - There is NO sandbox — commands run with your user's full permissions
# See docs/SECURITY.md §5 for the full threat model.
# Only enable this if you understand the risks and have set up the Mac node host.
node_exec_enabled: false

# Exec defaults to sandbox. Agents can target the Mac node on-demand with host=node.
# Node ID is NOT configured here — it's dynamic (changes on re-pairing).
# Pin it manually after pairing: openclaw config set tools.exec.node <id>
openclaw_exec_host: "sandbox"
openclaw_exec_security: "full"       # Unrestricted in sandbox/node; gateway blocked by elevated=false
openclaw_exec_ask: "off"             # No approval prompts (auto-approve node, auto-deny gateway)

# Sandbox settings
openclaw_sandbox_mode: "all"
openclaw_sandbox_workspace_access: "rw"
openclaw_sandbox_docker_network: "bridge"
openclaw_sandbox_docker_image: "openclaw-sandbox-custom:latest"
openclaw_sandbox_read_only_root: false  # Allow runtime pip/npm/curl installs (see docs/SECURITY.md §4)
openclaw_browser_allow_host_control: false  # Allow sandboxed agents to use browser tool with target="host"

# Telegram: silently suppress error reply messages (true = user sees nothing on failure)
openclaw_telegram_silent_error_replies: true

# Health monitor: restart channels that go silent (no events) for this many minutes
openclaw_health_monitor_stale_minutes: 15  # Default 30; lowered for faster disconnect detection

# Force sandbox image rebuild (override with -e force_sandbox_rebuild=true)
force_sandbox_rebuild: false

# Force Codex MCP Docker image rebuild (override with -e force_codex_rebuild=true)
force_codex_rebuild: false

# Force Claude Code MCP Docker image rebuild (override with -e force_claude_code_rebuild=true)
force_claude_code_rebuild: false

# Force Pi MCP Docker image rebuild (override with -e force_pi_mcp_rebuild=true)
force_pi_mcp_rebuild: false

# Force plugin reinstall (override with -e force_plugin_reinstall=true)
force_plugin_reinstall: false

# Force qmd reindex (override with -e force_qmd_reindex=true)
force_qmd_reindex: false

# qmd semantic search settings
# @tobilu/qmd published on npm — pin with semver
qmd_version: "2.0.1"
# Base port for qmd HTTP daemons (one per agent, assigned by position in qmd_workspaces).
# Port N+0 = first agent, N+1 = second, etc. Re-run --tags qmd,plugins if agents change.
qmd_http_base_port: 8191
# qmd collections for search. Paths are relative to the workspace root.
# qmd silently skips missing paths. Override in openclaw.yml for deployment-specific collections.
qmd_collections:
  - name: notes
    path: "notes"
    pattern: "**/*.{md,txt,csv}"
  - name: logs
    path: "logs"
    pattern: "**/*.md"
  - name: extracted-content
    path: ".scripts/extract-cache"
    pattern: "*.json"

# Agent definitions — single-agent default for new deployments.
# Override in openclaw.yml for multi-agent setups (see openclaw.yml.example).
openclaw_agents:
  - id: "main"
    is_default: true
    deliver_to: "{{ telegram_user_id | default('') }}"
    deliver_type: "dm"
    deliver_channel: "telegram"

# Legacy cron job names (removed during migration to per-agent jobs)
openclaw_legacy_cron_names:
  - "Morning Digest"
  - "Evening Review"
  - "Night Shift"
  - "Weekly Planning"
  - "Weekly Memory Maintenance"
  - "Daily Research Digest"
  - "Weekly Vault Insights"

# Per-agent cron jobs (only created when telegram is configured).
# Generic defaults for single-agent setup. Override in openclaw.yml for multi-agent.
openclaw_cron_jobs:
  - name: "main: Daily Standup"
    agent: "main"
    schedule: "30 9 * * *"
    message: "Good morning! Summarize what needs attention today."
  - name: "main: Night Shift"
    agent: "main"
    schedule: "0 23 * * *"
    message: "Night shift. Review notes, organize, triage, work through tasks. Prepare morning summary."

# MCP plugin configuration
openclaw_mcp_adapter:
  npm_package: "@pandysp/openclaw-mcp-adapter@0.1.7"
  npm_packages:
    - "@modelcontextprotocol/server-github"
    - "@openai/codex"
    - "node-exec-mcp"
    - "google-contacts-mcp"
  # Legacy Google servers (gmail/gdrive/gcal). Installed only while
  # google_mcp_legacy_enabled is true — see google_workspace_mcp below.
  npm_packages_google_legacy:
    - "@gongrzhe/server-gmail-autoauth-mcp"
    - "@modelcontextprotocol/server-gdrive"
    - "mcp-google-calendar"
  tool_prefix: true
  codex_sandbox: "workspace-write"
  codex_approval: "never"
  codex_docker_image: "codex-mcp:latest"
  codex_version: "0.118.0"       # Pin for reproducibility; update intentionally
  codex_memory_limit: "2g"       # Prevent runaway Codex from exhausting VPS RAM
  codex_proxy_port: 8787         # Port for the credential-injecting reverse proxy
  codex_oauth_client_id: "DRivsnm2Mu42T3KOpqdL9p3q9ByGaHfy"  # Codex OAuth client_id for token refresh (mcp-auth-proxy)
  # Claude Code settings
  claude_code_docker_image: "claude-code-mcp:latest"
  claude_code_version: "{{ claude_code_version }}"  # one pin, defined above
  claude_code_mcp_version: "2.2.0"  # Pin @pandysp/claude-code-mcp server for reproducibility
  claude_code_memory_limit: "2g"    # Monitor and adjust — Claude Code may need more than Codex
  # Pi MCP settings
  pi_mcp_docker_image: "pi-mcp:latest"
  pi_mcp_version: "0.1.2"
  pi_mcp_memory_limit: "1g"    # Lower than Codex/Claude Code — Pi is lighter (session trees, not full IDE)
  pi_mcp_model: "claude-opus-4-6"
  pi_mcp_thinking: "xhigh"
  # contracts.tools: tool names declared in openclaw.plugin.json so OpenClaw >=2026.5.x
  # includes adapter tools in agent bundles (resolvePluginToolRuntimePluginIds).
  # github/qmd/pi/claude-code tools load via descriptor cache and don't need this.
  # Update when adding new MCP server types.
  # The plugins role builds the effective list (_mcp_contract_tools) from
  # contract_tools + contract_tools_google_legacy (while the legacy switch is on)
  # + gworkspace_<tool> for google_workspace_mcp.tools (while that switch is on).
  contract_tools:
    - codex_codex
    - codex_codex-reply
    - gcontacts_contacts_list
    - gcontacts_contact_get
    - gcontacts_contact_search
    - gcontacts_contact_create
    - gcontacts_contact_update
    - gcontacts_contact_delete
    - gcontacts_directory_search
  contract_tools_google_legacy:
    - gmail_send_email
    - gmail_draft_email
    - gmail_read_email
    - gmail_search_emails
    - gmail_modify_email
    - gmail_delete_email
    - gmail_list_email_labels
    - gmail_batch_modify_emails
    - gmail_batch_delete_emails
    - gmail_create_label
    - gmail_update_label
    - gmail_delete_label
    - gmail_get_or_create_label
    - gmail_create_filter
    - gmail_list_filters
    - gmail_get_filter
    - gmail_delete_filter
    - gmail_create_filter_from_template
    - gmail_download_attachment
    - gdrive_search
    - gcal_list_calendars
    - gcal_list_calendar_events
    - gcal_create_calendar_event
    - gcal_get_calendar_event
    - gcal_edit_calendar_event
    - gcal_delete_calendar_event
  # Note: MCP servers are auto-generated from openclaw_agents × openclaw_mcp_server_types
  # in playbook.yml pre_tasks. The 'servers' key was removed — see _openclaw_mcp_servers.

# MCP server type templates — cross-producted with openclaw_agents to auto-generate
# the per-agent MCP server list (_openclaw_mcp_servers). Each type produces one server
# per agent with mechanical naming: <name_prefix> for main, <name_prefix>-<id> for others.
openclaw_mcp_server_types:
  - type: "github"
    name_prefix: "github"
  - type: "codex"
    name_prefix: "codex"
  - type: "claude-code"
    name_prefix: "claude"
  - type: "pi"
    name_prefix: "pi"
  - type: "qmd"
    name_prefix: "qmd"
  - type: "node-exec"
    name_prefix: "mac"
  - type: "gmail"
    name_prefix: "gmail"
  - type: "gdrive"
    name_prefix: "gdrive"
  - type: "gcal"
    name_prefix: "gcal"
  - type: "gcontacts"
    name_prefix: "gcontacts"
  - type: "gworkspace"
    name_prefix: "gworkspace"

# --- Google MCP migration (see docs/GOOGLE-WORKSPACE-MCP-ROLLOUT.md) ---
# Two independent switches so old and new can run side by side during rollout.
# The playbook drops disabled types from openclaw_mcp_server_types before the
# agents × types cross-product, so no server, deny rule or contract tool of a
# disabled type is generated.
#   legacy (gmail/gdrive/gcal npm servers) — archived/deprecated/unmaintained
#   gworkspace (workspace-mcp, Python via uv) — the replacement
google_mcp_legacy_enabled: true
google_workspace_mcp_enabled: false
# Remove the legacy npm packages once legacy is off. Separate opt-in because
# rollback must restore them from the npm-global backup tarball: a fresh
# install of mcp-google-calendar pulls a newer zod and OpenClaw loses its tools.
google_mcp_legacy_uninstall: false

# uv (Python tool runner) from the official GitHub release, checksum-verified.
uv_version: "0.13.5"
uv_sha256:
  x86_64: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
  aarch64: "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"

google_workspace_mcp:
  version: "2.3.0"
  # Resolve transitive dependencies as they were at the 2.3.0 release
  # (2026-10-30) so a reinstall does not silently pick up newer libraries.
  exclude_newer: "2026-10-31T00:00:00Z"
  # Least privilege: --permissions picks services and scopes in one go.
  # gmail:full = read, labels/modify, drafts, send, filters (gmail.settings.basic);
  #   no https://mail.google.com/ scope, so no permanent delete (trash via label).
  # drive:readonly matches the old gdrive server (search/read only).
  permissions:
    - "gmail:full"
    - "drive:readonly"
    - "calendar:full"
  tool_tier: "complete"
  disabled_tools: []
  # Loopback-only OAuth callback / attachment server (stdio mode starts it lazily).
  # Default bind would be 0.0.0.0, which UFW lets through on tailscale0.
  host: "127.0.0.1"
  port: 8000
  home_dir: "/home/ubuntu/.google_workspace_mcp"
  # Empty = upstream default (~/.workspace-mcp/attachments, host only; the
  # sandbox cannot read it, the agent uses return_base64 instead). A path inside
  # the workspace would make attachments visible to the sandbox, but also push
  # them through workspace Git sync and Obsidian Sync.
  attachment_dir: ""
  # Tools workspace-mcp 2.3.0 registers for the permissions + tier above
  # (derived from core/tool_tiers.yaml and each tool's required scopes).
  # Registered in the adapter manifest as gworkspace_<name>. Update together
  # with version/permissions/tool_tier.
  tools:
    - search_gmail_messages
    - get_gmail_message_content
    - get_gmail_messages_content_batch
    - send_gmail_message
    - get_gmail_attachment_content
    - get_gmail_thread_content
    - get_gmail_threads_content_batch
    - modify_gmail_message_labels
    - batch_modify_gmail_message_labels
    - list_gmail_labels
    - manage_gmail_label
    - draft_gmail_message
    - list_gmail_filters
    - manage_gmail_filter
    - start_google_auth
    - search_drive_files
    - get_drive_file_content
    - get_drive_file_download_url
    - get_drive_shareable_link
    - list_drive_items
    - get_drive_file_permissions
    - check_drive_file_public_access
    - list_calendars
    - get_events
    - manage_event
    - create_calendar
    - query_freebusy
    - manage_out_of_office
    - manage_focus_time
# Google account the agent acts as (USER_GOOGLE_EMAIL). Set in openclaw.yml.
google_workspace_user_email: ""

# Claude Code plugins installed into the VPS agents' `claude` CLI.
#
# Intentionally NOT defaulted here: which plugins a deployment wants is a
# per-deployment choice, and a hardcoded list silently rots when upstream
# marketplaces change (e.g. a plugin removed from its marketplace breaks
# provisioning). Define `claude_code_plugins` in group_vars/openclaw.yml to
# enable it — see openclaw.yml.example for the structure. When it is undefined
# the plugins role simply skips Claude Code plugin install
# (`when: claude_code_plugins is defined`).

# Obsidian Headless Sync (obsidian-headless npm package)
# Runs per-workspace sync daemons for near-real-time Obsidian Sync cloud access.
# Override in openclaw.yml to enable and configure per-deployment.
obsidian_headless_enabled: false
obsidian_headless_version: "0.0.12"
obsidian_headless_memory_max: "256M"
obsidian_headless_agents: []
obsidian_headless_initial_sync_timeout: 300
# Common non-vault directories to exclude from Obsidian Sync.
# Override in openclaw.yml to add workspace-specific exclusions.
obsidian_headless_excluded_folders: ".git,.venv,node_modules,.cache,.env"
# Obsidian config categories to sync. community-plugin[-data] is what carries
# community plugins to mobile (they ride git between machines, but only Obsidian
# Sync reaches the phone). Empty string disables config syncing entirely.
# Must match setup-mac-workspaces.sh OBSIDIAN_CONFIGS.
obsidian_headless_configs: "community-plugin,community-plugin-data"

# Note: openclaw_workspaces is auto-generated in playbook.yml pre_tasks from
# openclaw_agents. Override by defining openclaw_workspaces in openclaw.yml.
